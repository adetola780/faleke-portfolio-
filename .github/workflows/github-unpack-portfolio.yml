name: Unpack portfolio source

on:
  push:
    paths:
      - portfolio-upload.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack portfolio
        run: |
          unzip -o portfolio-upload.zip -d .
          rm portfolio-upload.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add complete Olumide Faleke portfolio"
          git push
